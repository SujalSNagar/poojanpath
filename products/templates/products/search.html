{% extends 'core/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/search.css' %}">
{% endblock extra_css %}

{% block body %}

<section class="container py-5">

    <h2 class="mb-4">
        Search Results
    </h2>

    <div class="row g-4">

        {% for product in products %}

        <div class="col-4 col-lg-4 col-xl-3">

            <div class="product-card search-product-card">

                <a href="{{ product.get_absolute_url }}"
                   class="product-card-link">

                    <img src="{{ product.image.url }}"
                         alt="{{ product.name }}">

                    <div class="product-card-body">

                        <h3>{{ product.name }}</h3>

                        <strong>
                            Rs. {{ product.price }}
                        </strong>

                    </div>

                </a>

                <div class="px-2 pb-2">

                    <form action="{% url 'cart:add' product.id %}"
                          method="post">

                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-main w-100 py-2">

                            Add to Cart

                        </button>

                    </form>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">

            <p class="text-muted">
                No products found.
            </p>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock body %}
